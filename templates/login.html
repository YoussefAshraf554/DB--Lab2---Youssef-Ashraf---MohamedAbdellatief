<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to see your to-do list.</p>

    {% if errors.form %}<div class="alert">{{ errors.form }}</div>{% endif %}

    <form id="loginForm" method="POST" action="{{ url_for('login') }}" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" class="{{ 'invalid' if errors.email }}">
        <span class="error" id="emailError">{{ errors.email }}</span>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="{{ 'invalid' if errors.password }}">
        <span class="error" id="passwordError">{{ errors.password }}</span>

        <button type="submit">Log in</button>
    </form>

    <p class="switch"><a href="{{ url_for('register') }}">Create an Account?</a></p>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
